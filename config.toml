# config.toml — Zola v0.22.1 + tabi theme, linuxgroot.net
#
# Dependency chain:
#   Zola reads this file -> loads theme from themes/tabi (git submodule, pinned to a
#   release tag) -> compiles content/ into public/ -> static/ (incl. _headers) is
#   copied verbatim into public/ -> wrangler.jsonc points Workers Static Assets at
#   public/ -> GitHub Actions builds and deploys.
#   Keys under the extra table are tabi's schema; top-level keys are Zola core schema.

base_url = "https://linuxgroot.net"
title = "LinuxGroot"
description = "Notes on Linux, HPC, and infrastructure automation"
default_language = "en"
theme = "tabi"

# tabi's stylesheets (skins, syntax palette, layout) are Sass: themes/tabi/sass/main.scss.
# Zola must compile them or the site ships with no CSS at all.
compile_sass = true

# Zola >= 0.19 renamed generate_feed -> generate_feeds (plural)
generate_feeds = true
feed_filenames = ["atom.xml"]

minify_html = true

taxonomies = [{ name = "tags", feed = true }]

build_search_index = true

[search]
# Must match tabi's client-side search implementation (elasticlunr + its JS loader)
index_format = "elasticlunr_javascript"

[markdown]
smart_punctuation = true
bottom_footnotes = true

# Zola 0.22 replaced the flat highlight_code / highlight_theme = "css" keys with this
# sub-table, and swapped the syntect highlighter for giallo. style = "class" emits
# .z-* classes instead of inline style attributes, so style-src can stay 'self' with
# no 'unsafe-inline'. giallo's class names still match tabi's sass/parts/_syntax_theme.scss,
# which is what actually colours the code blocks; light_theme/dark_theme only decide
# what Zola writes into the generated giallo-{light,dark}.css files, which tabi does
# not link. Chosen to match tabi's Catppuccin-based palette in case they are ever used.
[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-frappe"

[extra]
# TOML ordering matters here: every bare key below must appear BEFORE the first
# sub-table (extra.hcard). A sub-table opened mid-block silently captures every key
# that follows it, tabi then falls back to its own defaults, and the build still
# succeeds. That is how this file previously shipped tabi's default CSP.
# Keep extra.hcard (and any future sub-table) at the very bottom of this file.

# Public identity: handle only, never a real name (privacy constraint).
author = "LinuxGroot"

# tabi emits no icon link unless this is set explicitly.
favicon = "/favicon.ico"

theme_switcher = true
default_theme = ""  # follow OS preference
skin = "teal"

menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "archive", url = "archive", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
]

# --- Privacy hardening ---
# No links to source repo or commit history: repo is private and stays unreferenced.
show_remote_changes = false
show_remote_source = false
# remote_repository_url intentionally unset.

# All comment backends (giscus/utterances/hyvortalk/isso) left unconfigured: no
# third-party embeds, no visitor data leakage.
# Webmentions off (theme default), analytics unset: zero tracking scripts.

# Email: to publish one, base64-encode it first: printf 'you@linuxgroot.net' | base64
# email = "<base64-string>"
encode_plaintext_email = true

# --- Technical-blog ergonomics ---
copy_button = true          # ~700 B JS, copy button on code blocks
show_reading_time = true
show_date = true
toc = true                  # ToC on posts; disable per-page with toc = false
katex = false               # enable per-page in front matter when needed
mermaid = false             # enable per-page; loads ~2.5 MB JS only where used

# --- CSP (delivered by tabi as <meta http-equiv>) ---
# Tightened from tabi's default: img-src drops https://*, and frame-src is omitted so
# it falls back to default-src 'self' (no Vimeo/YouTube embeds).
# HTTP-header-only directives (frame-ancestors, HSTS) cannot be set from <meta>; they
# live in static/_headers and the Cloudflare SSL/TLS HSTS panel instead.
# script-src is NOT pure 'self': Cloudflare Web Analytics was enabled by explicit
# decision on 2026-08-28, and its beacon is edge-injected into every page. Without
# this entry the meta CSP blocks it and analytics silently collects nothing.
# The beacon posts to the same-origin /cdn-cgi/rum endpoint (automatic injection on a
# proxied zone). Do NOT add connect-src here: tabi emits connect-src 'self' on its own,
# and a second entry produces a duplicate token and an empty ;; directive.
# Removing Web Analytics means removing this entry too.
enable_csp = true
allowed_domains = [
    { directive = "font-src", domains = ["'self'", "data:"] },
    { directive = "img-src", domains = ["'self'", "data:"] },
    { directive = "media-src", domains = ["'self'"] },
    { directive = "script-src", domains = ["'self'", "https://static.cloudflareinsights.com/beacon.min.js"] },
    { directive = "style-src", domains = ["'self'"] },
]

# --- Sub-tables: must stay last (see ordering note at the top of the extra table) ---
# Minimal h-card: no biography/locality/avatar published.
[extra.hcard]
enable = false
