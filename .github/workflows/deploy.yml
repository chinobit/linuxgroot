# .github/workflows/deploy.yml - build with Zola, deploy to Cloudflare Workers
#
# Dependency chain:
#   push to main -> checkout WITH submodules (themes/tabi is a pinned submodule;
#   without submodules:true the theme is missing and zola build fails)
#   -> install Zola v0.22.1 binary (pinned; same version as local dev)
#   -> `zola build` WITHOUT --drafts: pages with draft = true never reach production
#   -> cloudflare/wrangler-action reads wrangler.jsonc and deploys public/.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN - scoped token: Account -> Workers Scripts -> Edit, this
#                           account only. Never the Global API Key.
#   CLOUDFLARE_ACCOUNT_ID - from Cloudflare dashboard sidebar.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only reads the repo; deploy auth is the Cloudflare token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        # Pinned by commit SHA (tag: v7.0.1) - tags are mutable, SHAs are not.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - name: Install Zola (checksum-verified)
        run: |
          curl -sL -o zola.tar.gz https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
          echo "0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef  zola.tar.gz" | sha256sum -c -
          sudo tar xzf zola.tar.gz -C /usr/local/bin && rm zola.tar.gz

      - name: Build site (drafts excluded)
        run: zola build

      # Gate on the artifact, not the config: every security bug so far built green.
      # LEAK_PATTERNS holds the identity/work strings that must never appear in the
      # built site. It is a secret because this repo is public: a literal deny-list in
      # the tracked script would publish the very strings it exists to suppress.
      # The script fails closed when CI is set and the file is missing or empty.
      - name: Verify build invariants (CSP, headers, privacy)
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -n "$LEAK_PATTERNS" ]; then
            printf '%s\n' "$LEAK_PATTERNS" > "$RUNNER_TEMP/leak-patterns"
          fi
          LEAK_PATTERNS_FILE="$RUNNER_TEMP/leak-patterns" ./scripts/verify-build.sh

      - name: Deploy to Cloudflare Workers
        # Pinned by commit SHA (tag: v4.0.0). v3.15.0 declared `using: node20`, which
        # the runner now force-upgrades to node24 with a deprecation annotation; v4.0.0
        # declares node24 natively. Its one breaking change is the default wrangler
        # version, which does not reach us because we pin that explicitly below.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          # v4 defaults to wrangler `latest`, and "latest" is not a version: an upstream
          # release would change what this workflow deploys with, without a commit here.
          # Pinned like every other tool in this repo. Must stay v4+ regardless, since
          # assets-only Workers (no `main` in wrangler.jsonc) fail on wrangler 3.
          wranglerVersion: '4.127.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
